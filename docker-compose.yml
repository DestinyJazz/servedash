services:
  servedash:
    image: ghcr.io/destinyjazz/servedash:latest
    container_name: servedash
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Docker socket, read-write — required for container discovery, the
      # built-in terminal (docker exec), and one-click image updates
      # (pull/stop/recreate). This is equivalent to root on the host.
      # Only expose Servedash on a trusted network.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persists manual drag-and-drop order across restarts
      - servedash-data:/app-data
    environment:
      # Auto-refresh interval in seconds. 0 or omit = disable auto-refresh.
      - REFRESH_INTERVAL=15
      # Image update check interval in minutes. 0 = manual only (click the button).
      - UPDATE_CHECK_INTERVAL=0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  servedash-data:
