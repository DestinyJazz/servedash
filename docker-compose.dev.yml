services:
  servedash-dev:
    build: .
    container_name: servedash-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Read-write — required for the built-in terminal (docker exec) and
      # one-click image updates (pull/stop/recreate). Equivalent to root
      # on the host; fine for local dev, keep off untrusted networks.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dev-data:/app-data
    environment:
      - PORT=3000
      # Auto-refresh interval in seconds. 0 = off.
      - REFRESH_INTERVAL=60
      # Image update check interval in minutes. 0 = manual only.
      - UPDATE_CHECK_INTERVAL=0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
