<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Servedash</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="servedash-icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="vendor/xterm/xterm.css"/>
<style>
:root {
  --bg:        #0d0f14;
  --surface:   #13161d;
  --surface2:  #1a1e27;
  --surface3:  #20242f;
  --border:    #252930;
  --border2:   #2e3340;
  --text:      #e8eaf2;
  --text2:     #8890a8;
  --text3:     #454d63;
  --accent:    #3b82f6;
  --accent-h:  #2563eb;
  --green:     #22c55e;
  --green-bg:  rgba(34,197,94,.1);
  --red:       #ef4444;
  --red-bg:    rgba(239,68,68,.1);
  --yellow:    #f59e0b;
  --yellow-bg: rgba(245,158,11,.1);
  --orange:    #f97316;
  --r:         10px;
  --sans:      'Inter', sans-serif;
  --mono:      'JetBrains Mono', monospace;
  --shadow:    0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.3);
}
[data-theme="light"] {
  --bg:        #f4f6fb;
  --surface:   #ffffff;
  --surface2:  #f0f2f8;
  --surface3:  #e8eaf4;
  --border:    #e0e4f0;
  --border2:   #d0d4e8;
  --text:      #111827;
  --text2:     #6b7280;
  --text3:     #9ca3af;
  --shadow:    0 2px 8px rgba(0,0,0,.07), 0 12px 32px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* TOPBAR */
.topbar{
  height:56px;display:flex;align-items:center;gap:10px;
  padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:700;letter-spacing:-.3px;margin-right:4px;cursor:pointer}
.logo .version{font-size:.74rem;font-weight:700;font-family:var(--mono);color:var(--accent);text-decoration:none;padding:3px 8px;border-radius:6px;background:rgba(59,130,246,.12);letter-spacing:0}
.logo .version:hover{background:rgba(59,130,246,.2)}
.logo .version.has-update{color:var(--orange);background:rgba(249,115,22,.18)}
.logo-mark{width:28px;height:28px;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.logo-mark svg{display:block;width:100%;height:100%}
.gap{flex:1}
.host-chip{
  display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:.7rem;font-family:var(--mono);color:var(--text2);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--green-bg);animation:blink 2.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.icon-btn{
  width:32px;height:32px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font-size:.85rem;transition:background .15s;
}
.icon-btn:hover{background:var(--surface3)}
.icon-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sort-btns{display:flex;gap:3px;margin-left:4px}
.sort-btns .icon-btn{width:auto;gap:5px;padding:0 9px}
.sort-lbl{font-size:.72rem;font-weight:500}
.sort-dir{font-size:.62rem;opacity:.7}
.refresh-btn{
  display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;
  background:var(--accent);color:#fff;font-size:.76rem;font-weight:600;
  transition:background .15s,transform .1s;
}
.refresh-btn:hover{background:var(--accent-h)}
.refresh-btn:active{transform:scale(.97)}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
.icon-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATS */
.stats-row{display:flex;gap:10px;padding:18px 24px 0}
.stat-card{
  flex:1;display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-radius:var(--r);background:var(--surface);border:1px solid var(--border);
}
.stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.si-blue {background:rgba(59,130,246,.12);color:var(--accent)}
.si-green{background:var(--green-bg);color:var(--green)}
.si-red  {background:var(--red-bg);color:var(--red)}
.si-gray {background:var(--surface3);color:var(--text2)}
.stat-label{font-size:.65rem;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.stat-val{font-size:1.4rem;font-weight:700;line-height:1}
.sv-blue {color:var(--accent)}
.sv-green{color:var(--green)}
.sv-red  {color:var(--red)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;padding:16px 24px 0}
.search-box{position:relative;flex:1;max-width:280px}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{
  width:100%;padding:7px 9px 7px 30px;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.76rem;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.f-count{font-size:.63rem;font-family:var(--mono);margin-left:3px;opacity:.75}
.filter-dd{position:relative}
.f-dd-btn{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--surface);font-size:.73rem;font-weight:500;
  color:var(--text);transition:all .15s;cursor:pointer;
}
.f-dd-btn:hover{border-color:var(--border2)}
.f-dd-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex:none}
.f-dd-dot.all{background:var(--text2)}
.f-dd-dot.running{background:var(--green)}
.f-dd-dot.exited{background:var(--red)}
.f-dd-dot.paused{background:var(--yellow)}
.f-dd-dot.unhealthy{background:var(--orange)}
.f-dd-menu{
  position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:170px;
  background:var(--surface);border:1px solid var(--border2);border-radius:8px;
  box-shadow:var(--shadow);padding:4px;display:none;
}
.f-dd-menu.open{display:block}
.f-dd-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;
  font-size:.73rem;font-weight:500;color:var(--text2);cursor:pointer;
}
.f-dd-item:hover{background:var(--surface2);color:var(--text)}
.f-dd-item.on{color:var(--text);background:var(--surface3)}
.f-dd-item .f-count{margin-left:auto;opacity:.7}
.view-btns{display:flex;gap:3px;margin-left:4px}

/* GRID VIEW */
.content{padding:14px 24px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

/* CARD */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:border-color .2s,box-shadow .2s;
  animation:up .22s ease both;
}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.drag-grip{cursor:grab;color:var(--text3);font-size:1rem;line-height:1;padding:0 2px;user-select:none;flex:none;transition:color .15s}
.drag-grip:hover{color:var(--text2)}
.drag-grip:active{cursor:grabbing}
.list-grip{margin-right:2px}
.card.dragging,.list-row.dragging{opacity:.4;border-style:dashed;border-color:var(--accent)}
.card.drop-target,.list-row.drop-target{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.running{border-top:2px solid var(--green)}
.card.exited {border-top:2px solid var(--red)}
.card.paused {border-top:2px solid var(--yellow)}
.card.unhealthy{border-top:2px solid var(--orange)}

.ch{display:flex;align-items:center;gap:11px;padding:14px 14px 11px}
.avatar{
  width:38px;height:38px;border-radius:8px;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--accent);
}
.cmeta{flex:1;min-width:0}
.cname{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cimage{font-size:.66rem;color:var(--text2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sbadge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;
  font-size:.66rem;font-weight:600;font-family:var(--mono);flex-shrink:0;
}
.sbadge.running{background:rgba(34,197,94,.16);color:var(--green)}
.sbadge.exited {background:rgba(239,68,68,.16);color:var(--red)}
.sbadge.paused {background:rgba(245,158,11,.18);color:var(--yellow)}
.sbadge.unhealthy{background:rgba(249,115,22,.2);color:var(--orange)}
.sbadge.created{background:rgba(59,130,246,.16);color:var(--accent)}
.sdot{width:5px;height:5px;border-radius:50%;background:currentColor}
.sbadge.running .sdot{animation:blink 2s infinite}
.sbadge.unhealthy .sdot{animation:blink 1s infinite}
.ubadge{
  display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:4px 9px;border-radius:6px;
  font-size:.66rem;font-weight:700;font-family:var(--mono);flex-shrink:0;border:none;
  background:var(--yellow);color:#1a1400;
  cursor:pointer;box-shadow:0 1px 3px rgba(245,158,11,.45);
  transition:filter .15s,transform .1s,box-shadow .15s;
}
.ubadge:hover{filter:brightness(1.1);box-shadow:0 3px 8px rgba(245,158,11,.55);transform:translateY(-1px)}
.ubadge:active{transform:translateY(0) scale(.96);box-shadow:0 1px 2px rgba(245,158,11,.4)}

.cstats{display:flex;gap:1px;margin:0 14px 11px;background:var(--border);border-radius:7px;overflow:hidden}
.cs{flex:1;background:var(--surface2);padding:7px 10px}
.cs-label{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.cs-val{font-size:.82rem;font-weight:600;font-family:var(--mono)}
.cs-bar{height:3px;background:var(--border2);border-radius:2px;margin-top:4px;overflow:hidden}
/* Load-based color tiers: green < 80% <= yellow < 90% <= red.
   Base color is green; .warn / .hot (set by barCls) override it. */
.cs-fill{height:100%;border-radius:2px;transition:width .6s ease,background .3s ease;background:var(--green)}
.cs-fill.warn{background:var(--yellow)}
.cs-fill.hot{background:var(--red)}

.cports{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 11px}
.ptag{font-size:.65rem;font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;color:var(--text2)}

/* PORT DROPDOWN */
.port-menu-wrap{position:relative;flex:1}
.port-menu-wrap .ca{width:100%}
.port-dropdown{
  position:absolute;bottom:calc(100% + 4px);left:0;right:0;z-index:50;
  background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow);
  display:none;flex-direction:column;
}
.port-menu-wrap.open .port-dropdown{display:flex}
.port-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;font-size:.72rem;font-family:var(--mono);
  color:var(--text2);cursor:pointer;transition:background .12s,color .12s;
  border-bottom:1px solid var(--border);
}
.port-option:last-child{border-bottom:none}
.port-option:hover{background:var(--surface3);color:var(--accent)}
.port-option-port{font-weight:600;color:var(--text)}
.port-option-proto{font-size:.65rem;color:var(--text3)}

.actions-menu-wrap{position:relative;flex:1}
.actions-menu-wrap .ca{width:100%}
.am-menu{
  position:absolute;bottom:calc(100% + 4px);right:0;min-width:140px;z-index:50;
  background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow);display:none;flex-direction:column;
}
.actions-menu-wrap.open .am-menu{display:flex}
.am-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:.72rem;font-weight:500;
  color:var(--text2);cursor:pointer;transition:background .12s,color .12s;border-bottom:1px solid var(--border);
}
.am-item:last-child{border-bottom:none}
.am-item:hover{background:var(--surface3)}
.am-item.stop:hover{color:var(--red)}
.am-item.pause:hover{color:var(--yellow)}
.am-item.start:hover,.am-item.unpause:hover{color:var(--green)}
.am-item.restart:hover{color:var(--accent)}

.cactions{display:flex;border-top:1px solid var(--border)}
.ca{
  flex:1;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:.7rem;font-weight:500;color:var(--text2);background:var(--surface);
  transition:background .15s,color .15s;
}
.ca:hover{background:var(--surface2);color:var(--text)}
.ca.open:hover   {color:var(--accent)}
.ca.logs:hover   {color:var(--yellow)}
.ca.term:hover   {color:var(--accent)}
.ca.start:hover  {color:var(--green)}
.ca.stop:hover   {color:var(--red)}
.ca.restart:hover{color:var(--orange)}
.ca:disabled{opacity:.3;pointer-events:none}
.ca+.ca{border-left:1px solid var(--border)}

/* LIST VIEW */
.list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.list-header{
  display:grid;grid-template-columns:2fr 2.5fr 90px 110px 110px 160px;
  gap:12px;padding:9px 16px;
  background:var(--surface2);
  font-size:.66rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;
}
.list-row{
  display:grid;grid-template-columns:2fr 2.5fr 90px 110px 110px 160px;
  gap:12px;padding:11px 16px;align-items:center;
  background:var(--surface);transition:background .15s;
  animation:up .2s ease both;
}
.list-row:hover{background:var(--surface2)}
.list-row.running{border-left:2px solid var(--green)}
.list-row.exited {border-left:2px solid var(--red)}
.list-row.paused {border-left:2px solid var(--yellow)}
.list-row.unhealthy{border-left:2px solid var(--orange)}
.list-name{display:flex;align-items:center;gap:8px}
.list-avatar{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  background:var(--surface3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.62rem;font-weight:600;color:var(--accent);
}
.list-cname{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-image{font-size:.68rem;color:var(--text2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-stat{font-size:.78rem;font-weight:600;font-family:var(--mono)}
.list-actions{display:flex;gap:4px;justify-content:flex-end}
.la{
  padding:4px 8px;border-radius:5px;border:1px solid var(--border);
  font-size:.68rem;font-weight:500;color:var(--text2);background:var(--surface);
  transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px;
}
.la:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.la.open:hover   {color:var(--accent);border-color:var(--accent)}
.la.logs:hover   {color:var(--yellow);border-color:var(--yellow)}
.la.term:hover   {color:var(--accent);border-color:var(--accent)}
.la.stop:hover   {color:var(--red);border-color:var(--red)}
.la.start:hover  {color:var(--green);border-color:var(--green)}
.la.restart:hover{color:var(--orange);border-color:var(--orange)}
.la:disabled{opacity:.3;pointer-events:none}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{
  width:100%;max-width:900px;max-height:88vh;background:var(--surface);
  border:1px solid var(--border2);border-radius:14px;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.5);animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.mh-name{font-size:.92rem;font-weight:600;flex:1}
.mh-id{font-size:.68rem;color:var(--text2);font-family:var(--mono)}
.mcontrols{display:flex;gap:7px;align-items:center}
.tail-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 7px;font-size:.72rem;font-family:var(--mono);outline:none}
.close-btn{width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:.95rem;transition:all .15s}
.close-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.log-filter-bar{padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.log-filter{width:100%;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:.73rem;outline:none}
.log-filter:focus{border-color:var(--accent)}
.log-body{flex:1;overflow-y:auto;padding:12px 18px;font-family:var(--mono);font-size:.72rem;line-height:1.75}
.log-line{display:flex;gap:12px;padding:1px 0}
.log-line:hover{background:rgba(255,255,255,.025);margin:0 -18px;padding:1px 18px;border-radius:3px}
.log-ts{color:var(--text3);flex-shrink:0;user-select:none}
.log-txt{color:var(--text);white-space:pre-wrap;word-break:break-all}
.log-txt.err{color:var(--red)}
.log-hl .log-txt{background:rgba(245,158,11,.15);border-radius:2px}
.log-empty{color:var(--text2);text-align:center;padding:48px;font-size:.83rem}

/* TERMINAL MODAL */
.term-modal{max-width:960px;height:70vh}
.term-body{flex:1;overflow:hidden;padding:10px 14px;background:#0a0c10;display:flex}
.term-body .xterm{flex:1}
.term-status{padding:9px 18px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:.76rem;color:var(--text2);font-family:var(--mono)}
.term-status.err{color:var(--red)}

/* CONFIRM / UPDATE MODAL */
.confirm-modal{max-width:460px}
.confirm-body{padding:18px;font-size:.83rem;line-height:1.6}
.confirm-reasons{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.confirm-reasons li{background:var(--yellow-bg);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:9px 11px;font-size:.78rem;color:var(--text)}
.confirm-check{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:.78rem;color:var(--text2);cursor:pointer}
.confirm-check input{margin-top:2px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.confirm-actions button{padding:7px 14px;border-radius:7px;font-size:.78rem;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--text)}
.confirm-actions .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.confirm-actions .btn-primary.risky{background:var(--orange);border-color:var(--orange)}
.confirm-actions .btn-primary:disabled{opacity:.4;pointer-events:none}

/* TOAST */
.toast{
  position:fixed;bottom:22px;right:22px;z-index:300;
  display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);
  font-size:.78rem;font-weight:500;transform:translateY(70px);opacity:0;
  transition:transform .3s ease,opacity .3s ease;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok {border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:2.2rem;margin-bottom:10px;opacity:.4}
.empty h3{font-size:.95rem;font-weight:600;margin-bottom:5px;color:var(--text)}
.empty p{font-size:.78rem}

/* FOOTER */
.footer{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:20px;font-size:.72rem;color:var(--text3);
  border-top:1px solid var(--border);margin-top:8px;
}
.footer a{color:var(--text3);text-decoration:none;transition:color .15s}
.footer a:hover{color:var(--accent)}
.footer-dot{opacity:.5}
</style>
</head>

<script>
/* STATE */
let containers = [];
let filter  = 'all';
let query   = '';
let viewMode = localStorage.getItem('sd-view') || 'grid';
let logId   = null;
let allLines = [];

/* SORT / ORDER STATE
   sortMode: 'manual' | 'name' | 'uptime'
   manualOrder: array of container names in user-defined order (from backend)
   dir: 'asc' | 'desc' for the active sort button */
let sortMode = 'manual';
let manualOrder = [];
let nameDir = 'asc';
let uptimeDir = 'desc';
let refreshTimer = null;
let updates = {}; // containerName -> { status }

/* THEME */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const initTheme = localStorage.getItem('sd-theme') || 'dark';
html.dataset.theme = initTheme;
themeBtn.textContent = initTheme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', () => {
  const n = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = n;
  localStorage.setItem('sd-theme', n);
  themeBtn.textContent = n === 'dark' ? '☀️' : '🌙';
});

/* VIEW TOGGLE */
const gridBtn = document.getElementById('gridBtn');
const listBtn = document.getElementById('listBtn');
function setView(v) {
  viewMode = v;
  localStorage.setItem('sd-view', v);
  gridBtn.classList.toggle('active', v === 'grid');
  listBtn.classList.toggle('active', v === 'list');
  render();
}
gridBtn.addEventListener('click', () => setView('grid'));
listBtn.addEventListener('click', () => setView('list'));
// init button state
gridBtn.classList.toggle('active', viewMode === 'grid');
listBtn.classList.toggle('active', viewMode === 'list');

/* TOAST */
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.className = `toast ${type} show`;
  el.innerHTML = `<span>${type === 'ok' ? '✅' : '❌'}</span>${msg}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

/* API */
async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* LOAD */
async function loadInfo() {
  try {
    const d = await get('/api/info');
    document.getElementById('hostText').textContent = `Docker ${d.dockerVersion} · ${d.os}`;
    document.getElementById('sTotal').textContent   = d.containers;
    document.getElementById('sRunning').textContent = d.running;
    document.getElementById('sStopped').textContent = d.stopped;
    document.getElementById('sImages').textContent  = d.images;
  } catch(e) {
    document.getElementById('hostText').textContent = 'Connection error';
  }
}

async function loadContainers(isAuto = false) {
  const btn = document.getElementById('refreshBtn');
  if (!isAuto) btn.classList.add('spinning');
  try {
    const fresh = await get('/api/containers');
    // On auto-refresh, patch data in place to avoid a full re-render
    // (no flicker, keeps scroll position, drag order, open menus).
    // Fall back to full render if the container set changed structurally.
    if (isAuto && canPatch(containers, fresh)) {
      containers = fresh;
      patchContainers();
    } else {
      containers = fresh;
      render();
    }
    updateCounts();
  } catch(e) {
    if (!isAuto) toast('Failed to load containers', 'err');
  }
  if (!isAuto) btn.classList.remove('spinning');
}

// Can we patch in place? Only if the same containers exist with the same
// running-state (structural changes need a full render: add/remove/start/stop).
function canPatch(oldList, newList) {
  if (!oldList || oldList.length !== newList.length) return false;
  const oldByName = {};
  oldList.forEach(c => { oldByName[c.name] = c; });
  for (const c of newList) {
    const o = oldByName[c.name];
    if (!o) return false;                       // new container
    if (o.status !== c.status) return false;    // running<->stopped flip
    const oRun = o.status === 'running', nRun = c.status === 'running';
    if (oRun !== nRun) return false;
  }
  return true;
}

// Update only the volatile fields inside existing cards/rows.
function patchContainers() {
  const wrap = document.getElementById('container');
  containers.forEach(c => {
    const els = wrap.querySelectorAll(`[data-name="${cssEsc(c.name)}"]`);
    els.forEach(el => {
      // status badge (label + class) — handles healthy<->unhealthy
      const badge = el.querySelector('[data-field="badge"]');
      if (badge) {
        const sc = sClass(c);
        badge.className = `sbadge ${sc}`;
        badge.innerHTML = `<div class="sdot"></div>${sLabel(c)}`;
        // keep the card/row accent border in sync
        el.classList.remove('running','exited','paused','unhealthy');
        el.classList.add(sc);
      }
      // CPU / memory values + bars
      if (c.stats) {
        const cpu = c.stats.cpu, mem = c.stats.memPercent;
        const cv = el.querySelector('[data-field="cpu-val"]');
        const cb = el.querySelector('[data-field="cpu-bar"]');
        const mv = el.querySelector('[data-field="mem-val"]');
        const mb = el.querySelector('[data-field="mem-bar"]');
        if (cv) cv.textContent = `${cpu}%`;
        if (cb) { cb.className = `cs-fill cpu ${barCls(cpu)}`; cb.style.width = `${Math.min(cpu,100)}%`; }
        if (mv) mv.textContent = `${c.stats.memUsage} MB`;
        if (mb) { mb.className = `cs-fill mem ${barCls(mem)}`; mb.style.width = `${Math.min(mem,100)}%`; }
      }
    });
  });
}

// Escape a string for use in a CSS attribute selector
function cssEsc(s) {
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return s.replace(/["\\\]]/g, '\\$&');
}

// Check for image updates in the background; re-render badges when ready.
// Network-bound (hits the registry), so never blocks the main load.
// manual=true means user clicked the button (show toast + spinner feedback).
let updateCheckInterval = 0;
async function loadUpdates(manual = false) {
  const btn = document.getElementById('updateCheckBtn');
  if (manual && btn) btn.classList.add('spinning');
  try {
    const d = await get('/api/updates');
    updates = d.updates || {};
    render();
    reflectSelfUpdate();
    if (manual) {
      const n = Object.values(updates).filter(u => u.status === 'update').length;
      if (n > 0) toast(`${n} update${n > 1 ? 's' : ''} available`);
      else toast('All images up to date');
    }
  } catch(e) {
    if (manual) toast('Update check failed', 'err');
  }
  if (manual && btn) btn.classList.remove('spinning');
}

async function loadAll(isAuto = false) {
  await Promise.all([loadInfo(), loadContainers(isAuto)]);
  // Only auto-check on load if an interval is configured (0 = strictly manual)
  if (!isAuto && updateCheckInterval > 0) loadUpdates(false);
}

/* HELPERS */
// Status helpers take the container so an unhealthy running container
// can be shown as "Unhealthy" rather than plain "Running".
function sClass(c) {
  if (c.status === 'running' && c.health === 'unhealthy') return 'unhealthy';
  return c.status === 'running' ? 'running' : c.status === 'paused' ? 'paused' : 'exited';
}
function sLabel(c) {
  if (c.status === 'running' && c.health === 'unhealthy') return 'Unhealthy';
  return c.status === 'running' ? 'Running' : c.status === 'paused' ? 'Paused' : c.status === 'created' ? 'Created' : 'Stopped';
}
function init(name) { return name.slice(0,2).toUpperCase(); }
function barCls(v) { return v >= 90 ? 'hot' : v >= 80 ? 'warn' : ''; }

// Build the Actions dropdown for a container, listing only actions valid
// for its current state:
//   running (not paused) -> Restart, Pause, Stop
//   paused               -> Unpause, Stop
//   stopped/exited       -> Start
function actionsMenu(c) {
  const icons = {
    start:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
    restart: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>',
    pause:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
    unpause: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
    stop:    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
  };
  let actions;
  if (c.status === 'paused') actions = ['unpause', 'stop'];
  else if (c.status === 'running') actions = ['restart', 'pause', 'stop'];
  else actions = ['start'];

  const items = actions.map(a =>
    `<div class="am-item ${a}" onclick="act('${c.fullId}','${a}','${esc(c.name)}')">${icons[a]}<span>${a.charAt(0).toUpperCase()+a.slice(1)}</span></div>`
  ).join('');

  return `<div class="actions-menu-wrap" onclick="event.stopPropagation();toggleActionsMenu(this)">
    <button class="ca actions-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      Actions
    </button>
    <div class="am-menu">${items}</div>
  </div>`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildUrl(c) {
  if (c.url) return c.url;
  if (c.port) return `http://${window.location.hostname}:${c.port}`;
  return null;
}

// All public ports for a container
function publicPorts(c) {
  return (c.ports || []).filter(p => p.PublicPort);
}

// Build URL from a specific port entry
function portUrl(p) {
  const proto = p.PublicPort === 443 || p.PublicPort === 9443 || p.PublicPort === 8443 ? 'https' : 'http';
  return `${proto}://${window.location.hostname}:${p.PublicPort}`;
}

// Toggle port dropdown (closes all others first)
function togglePortMenu(el) {
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.port-menu-wrap.open').forEach(w => w.classList.remove('open'));
  if (!isOpen) {
    el.classList.add('open');
    // Close when clicking outside
    setTimeout(() => {
      document.addEventListener('click', function handler(e) {
        if (!el.contains(e.target)) {
          el.classList.remove('open');
          document.removeEventListener('click', handler);
        }
      });
    }, 0);
  }
}

function toggleActionsMenu(el) {
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.actions-menu-wrap.open').forEach(w => w.classList.remove('open'));
  if (!isOpen) {
    el.classList.add('open');
    setTimeout(() => {
      document.addEventListener('click', function handler(e) {
        if (!el.contains(e.target)) {
          el.classList.remove('open');
          document.removeEventListener('click', handler);
        }
      });
    }, 0);
  }
}

/* FILTER */
function matchesFilter(c) {
  switch (filter) {
    case 'all': return true;
    case 'running': return c.status === 'running';
    case 'exited': return c.status !== 'running' && c.status !== 'paused';
    case 'paused': return c.status === 'paused';
    case 'unhealthy': return c.status === 'running' && c.health === 'unhealthy';
    default: return true;
  }
}
function filtered() {
  return containers.filter(c => {
    const mf = matchesFilter(c);
    const mq = !query || c.name.toLowerCase().includes(query) || c.image.toLowerCase().includes(query);
    return mf && mq;
  });
}

/* ORDER — apply manual order or an active sort rule */
function ordered(items) {
  const list = items.slice();
  if (sortMode === 'name') {
    list.sort((a, b) => a.name.localeCompare(b.name));
    if (nameDir === 'desc') list.reverse();
    return list;
  }
  if (sortMode === 'uptime') {
    // created is a unix timestamp (seconds); older = longer uptime
    list.sort((a, b) => a.created - b.created); // oldest first = longest uptime first
    if (uptimeDir === 'asc') list.reverse();    // asc = shortest uptime first
    return list;
  }
  if (sortMode === 'update') {
    // containers with an available update first, then by name
    const rank = (c) => (updates[c.name] && updates[c.name].status === 'update') ? 0 : 1;
    list.sort((a, b) => {
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
    return list;
  }
  // manual: order by saved name list, unknown names fall to the end in original order
  if (manualOrder.length) {
    const idx = {};
    manualOrder.forEach((n, i) => { idx[n] = i; });
    list.sort((a, b) => {
      const ia = a.name in idx ? idx[a.name] : Infinity;
      const ib = b.name in idx ? idx[b.name] : Infinity;
      return ia - ib;
    });
  }
  return list;
}

function updateCounts() {
  const all = containers.length;
  const run = containers.filter(c=>c.status==='running').length;
  const stop = containers.filter(c=>c.status!=='running' && c.status!=='paused').length;
  const pause = containers.filter(c=>c.status==='paused').length;
  const unhealthy = containers.filter(c=>c.status==='running' && c.health==='unhealthy').length;
  document.getElementById('cAll').textContent = all;
  document.getElementById('cRun').textContent = run;
  document.getElementById('cStop').textContent = stop;
  document.getElementById('cPause').textContent = pause;
  document.getElementById('cUnhealthy').textContent = unhealthy;
  // the active filter's count shown on the dropdown button
  const map = { all, running:run, exited:stop, paused:pause, unhealthy };
  document.getElementById('fCount').textContent = map[filter] != null ? map[filter] : all;
}

/* LOGS */
function parseTS(ts) {
  try { return new Date(ts.split(' ')[0]).toLocaleTimeString(); } catch { return ts.slice(0,19); }
}
async function openLogs(id, name) {
  logId = id;
  document.getElementById('mName').textContent = name;
  document.getElementById('mId').textContent   = id.slice(0,12);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('logFilter').value = '';
  await fetchLogs();
}
async function fetchLogs() {
  const body = document.getElementById('logBody');
  const tail = document.getElementById('tailSel').value;
  body.innerHTML = '<div class="log-empty">Loading…</div>';
  try {
    const d = await get(`/api/containers/${logId}/logs?tail=${tail}`);
    allLines = d.logs || [];
    renderLogs('');
  } catch {
    body.innerHTML = `<div class="log-empty" style="color:var(--red)">Error loading logs.</div>`;
  }
}
function renderLogs(ft) {
  const body = document.getElementById('logBody');
  const f = ft.toLowerCase();
  const lines = f ? allLines.filter(l => l.line.toLowerCase().includes(f)) : allLines;
  if (!lines.length) { body.innerHTML = '<div class="log-empty">No log entries found.</div>'; return; }
  body.innerHTML = lines.map(({stream, line}) => {
    const parts = line.split(' ');
    const ts   = parseTS(parts[0] || '');
    const text = esc(parts.slice(1).join(' '));
    const hl   = f && line.toLowerCase().includes(f) ? 'log-hl' : '';
    return `<div class="log-line ${hl}"><span class="log-ts">${ts}</span><span class="log-txt ${stream==='stderr'?'err':''}">${text}</span></div>`;
  }).join('');
  body.scrollTop = body.scrollHeight;
}

/* TERMINAL */
let termWs = null;
let term = null;
let fitAddon = null;
let termResizeObserver = null;

// base64 <-> raw bytes, not base64 <-> JS-string — the exec stream is
// arbitrary bytes (control sequences, UTF-8, etc.), and btoa()/atob() only
// handle Latin1, so we go through Uint8Array explicitly in both directions.
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function closeTerminal() {
  document.getElementById('termOverlay').classList.remove('open');
  if (termWs) { termWs.onclose = null; termWs.close(); termWs = null; }
  if (termResizeObserver) { termResizeObserver.disconnect(); termResizeObserver = null; }
  if (term) { term.dispose(); term = null; }
  document.getElementById('termContainer').innerHTML = '';
}

function openTerminal(id, name) {
  document.getElementById('termName').textContent = name;
  document.getElementById('termId').textContent = id.slice(0, 12);
  document.getElementById('termOverlay').classList.add('open');
  const statusEl = document.getElementById('termStatus');
  statusEl.textContent = 'Connecting…';
  statusEl.className = 'term-status';

  term = new Terminal({
    fontFamily: 'JetBrains Mono, monospace',
    fontSize: 13,
    theme: { background: '#0a0c10' },
    cursorBlink: true,
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('termContainer'));
  fitAddon.fit();

  const sendResize = () => {
    if (termWs && termWs.readyState === WebSocket.OPEN) {
      termWs.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  };

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  termWs = new WebSocket(`${proto}://${location.host}/ws/exec/${id}`);
  termWs.onopen = () => { statusEl.textContent = 'Connected'; sendResize(); };
  termWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'data') term.write(b64ToBytes(msg.data));
    else if (msg.type === 'error') { statusEl.textContent = msg.message; statusEl.className = 'term-status err'; }
  };
  termWs.onclose = () => { statusEl.textContent = 'Disconnected'; };
  termWs.onerror = () => { statusEl.className = 'term-status err'; statusEl.textContent = 'Connection error'; };

  term.onData((data) => {
    if (termWs && termWs.readyState === WebSocket.OPEN) {
      termWs.send(JSON.stringify({ type: 'data', data: bytesToB64(new TextEncoder().encode(data)) }));
    }
  });

  termResizeObserver = new ResizeObserver(() => { fitAddon.fit(); sendResize(); });
  termResizeObserver.observe(document.getElementById('termContainer'));
}

document.getElementById('closeTerm').addEventListener('click', closeTerminal);
document.getElementById('termOverlay').addEventListener('click', e => { if (e.target === document.getElementById('termOverlay')) closeTerminal(); });

/* IMAGE UPDATE (risk-classified pull + recreate) */
let updateTarget = null; // { id, name, risky }

function closeUpdateModal() {
  document.getElementById('updateOverlay').classList.remove('open');
  updateTarget = null;
}

async function openUpdateConfirm(id, name) {
  document.getElementById('updName').textContent = name;
  document.getElementById('updId').textContent = id.slice(0, 12);
  const body = document.getElementById('updateBody');
  const confirmBtn = document.getElementById('updateConfirmBtn');
  body.innerHTML = 'Checking…';
  confirmBtn.disabled = true;
  confirmBtn.classList.remove('risky');
  confirmBtn.textContent = 'Update now';
  document.getElementById('updateOverlay').classList.add('open');

  let risk;
  try {
    risk = await get(`/api/containers/${id}/update-risk`);
  } catch {
    body.innerHTML = 'Could not check update risk.';
    return;
  }
  updateTarget = { id, name, risky: risk.risky };

  if (!risk.risky) {
    body.innerHTML = `This will pull the new image and recreate <b>${esc(name)}</b> with its current configuration (ports, volumes, env). The container restarts briefly.`;
    confirmBtn.disabled = false;
  } else {
    body.innerHTML = `
      <p>Updating <b>${esc(name)}</b> carries some risk:</p>
      <ul class="confirm-reasons">${risk.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <label class="confirm-check">
        <input type="checkbox" id="riskAck"/>
        <span>I understand the risk, update anyway</span>
      </label>`;
    confirmBtn.classList.add('risky');
    confirmBtn.textContent = 'Update anyway';
    confirmBtn.disabled = true;
    document.getElementById('riskAck').addEventListener('change', e => { confirmBtn.disabled = !e.target.checked; });
  }
}

document.getElementById('updateConfirmBtn').addEventListener('click', async () => {
  if (!updateTarget) return;
  const { id, name, risky } = updateTarget;
  const btn = document.getElementById('updateConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'Updating…';
  try {
    const r = await fetch(`/api/containers/${id}/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ confirm: risky }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Update failed');
    toast(`${name} updated`);
    closeUpdateModal();
    setTimeout(loadAll, 900);
  } catch (e) {
    toast(e.message, 'err');
    btn.disabled = false;
    btn.textContent = risky ? 'Update anyway' : 'Update now';
  }
});
document.getElementById('updateCancelBtn').addEventListener('click', closeUpdateModal);
document.getElementById('closeUpdate').addEventListener('click', closeUpdateModal);
document.getElementById('updateOverlay').addEventListener('click', e => { if (e.target === document.getElementById('updateOverlay')) closeUpdateModal(); });

/* DRAG & DROP REORDER */
let dragName = null;
function attachDrag() {
  const wrap = document.getElementById('container');
  const els = wrap.querySelectorAll('[draggable="true"]');
  els.forEach(el => {
    el.addEventListener('dragstart', e => {
      dragName = el.dataset.name;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      wrap.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (el.dataset.name !== dragName) el.classList.add('drop-target');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drop-target');
      const targetName = el.dataset.name;
      if (!dragName || dragName === targetName) return;
      reorder(dragName, targetName);
    });
  });
}

// Move dragName to the position of targetName, switch to manual mode, persist
function reorder(fromName, toName) {
  // Build the current full visible order as the base
  const current = ordered(filtered()).map(c => c.name);
  const from = current.indexOf(fromName);
  const to = current.indexOf(toName);
  if (from < 0 || to < 0) return;
  current.splice(to, 0, current.splice(from, 1)[0]);

  // Merge with any names not currently visible (filtered out) so we don't lose them
  const hidden = manualOrder.filter(n => !current.includes(n));
  manualOrder = current.concat(hidden);

  // Switch to manual mode and clear sort button highlights
  sortMode = 'manual';
  document.getElementById('sortName').classList.remove('active');
  document.getElementById('sortUptime').classList.remove('active');
  document.getElementById('sortUpdate').classList.remove('active');
  render();
  saveOrder();
}

async function saveOrder() {
  try {
    await fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order: manualOrder })
    });
  } catch {
    toast('Could not save order', 'err');
  }
}

async function loadOrder() {
  try {
    const d = await get('/api/order');
    manualOrder = Array.isArray(d.order) ? d.order : [];
  } catch {
    manualOrder = [];
  }
}

/* SORT BUTTONS — clicking applies the rule and overrides manual order */
const sortNameBtn = document.getElementById('sortName');
const sortUptimeBtn = document.getElementById('sortUptime');
const sortUpdateBtn = document.getElementById('sortUpdate');

function clearSortActive() {
  sortNameBtn.classList.remove('active');
  sortUptimeBtn.classList.remove('active');
  sortUpdateBtn.classList.remove('active');
}

function setSortLabels() {
  document.getElementById('sortNameLbl').innerHTML =
    'Name' + (sortMode === 'name' ? ` <span class="sort-dir">${nameDir === 'asc' ? 'A–Z' : 'Z–A'}</span>` : '');
  document.getElementById('sortUptimeLbl').innerHTML =
    'Uptime' + (sortMode === 'uptime' ? ` <span class="sort-dir">${uptimeDir === 'desc' ? '↓' : '↑'}</span>` : '');
}

sortNameBtn.addEventListener('click', () => {
  if (sortMode === 'name') { nameDir = nameDir === 'asc' ? 'desc' : 'asc'; }
  else { sortMode = 'name'; }
  clearSortActive();
  sortNameBtn.classList.add('active');
  setSortLabels();
  render();
});

sortUptimeBtn.addEventListener('click', () => {
  if (sortMode === 'uptime') { uptimeDir = uptimeDir === 'desc' ? 'asc' : 'desc'; }
  else { sortMode = 'uptime'; }
  clearSortActive();
  sortUptimeBtn.classList.add('active');
  setSortLabels();
  render();
});

sortUpdateBtn.addEventListener('click', () => {
  sortMode = 'update';
  clearSortActive();
  sortUpdateBtn.classList.add('active');
  setSortLabels();
  render();
});

/* CONFIG + AUTO-REFRESH */
let updateCheckTimer = null;
let appVersion = '';
async function loadConfig() {
  try {
    const d = await get('/api/config');
    appVersion = d.version || '';
    const vt = document.getElementById('versionTag');
    if (vt && appVersion) vt.textContent = 'v' + appVersion;
    const sec = parseInt(d.refreshInterval, 10) || 0;
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    if (sec > 0) {
      refreshTimer = setInterval(() => loadAll(true), sec * 1000);
    }
    // image update check interval (minutes). 0 = manual only.
    const upMin = parseInt(d.updateCheckInterval, 10) || 0;
    updateCheckInterval = upMin;
    if (updateCheckTimer) { clearInterval(updateCheckTimer); updateCheckTimer = null; }
    if (upMin > 0) {
      updateCheckTimer = setInterval(() => loadUpdates(false), upMin * 60 * 1000);
    }
  } catch {}
}

// Highlight the version tag if Servedash itself has an update available.
function reflectSelfUpdate() {
  const vt = document.getElementById('versionTag');
  if (!vt) return;
  const self = containers.find(c => /\/servedash(:|$)/.test(c.image) || c.image.includes('servedash'));
  const hasUpdate = self && updates[self.name] && updates[self.name].status === 'update';
  vt.classList.toggle('has-update', !!hasUpdate);
  vt.title = hasUpdate ? 'A new Servedash version is available — click for release notes' : 'View release notes';
}

/* REFRESH */
document.getElementById('refreshBtn').addEventListener('click', loadAll);
document.getElementById('updateCheckBtn').addEventListener('click', () => loadUpdates(true));

/* INIT */
(async function bootstrap() {
  await loadOrder();
  await loadConfig();
  await loadAll();
})();
</script>
</body>
</html>
